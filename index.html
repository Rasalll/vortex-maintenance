<!doctype html>
<html lang="en">

<head>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->

  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#7c3aed" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VORTEX Global Technologies" />
  <meta property="og:title" content="VORTEX Global Technologies — Learn Today. Lead Tomorrow." />

  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="VORTEX Global Technologies — Learn Today. Lead Tomorrow." />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="VORTEX Global Technologies — Learn Today. Lead Tomorrow." />
  <meta name="twitter:description"
    content="AI-integrated education, software, automation, and innovation. Empowering a smarter tomorrow." />
  <meta name="twitter:image" content="https://www.vortexglobaltechnologies.in/og-image.jpg" />
  <meta name="twitter:image:alt" content="VORTEX Global Technologies" />

  <!-- JSON-LD: Organization Schema -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "VORTEX Global Technologies",
      "url": "https://www.vortexglobaltechnologies.in/",
      "logo": "https://www.vortexglobaltechnologies.in/favicon.png",
      "description": "VORTEX Global Technologies is an AI-integrated technology company delivering AI education, software solutions, automation, IoT, startup incubation, and digital marketing.",
      "sameAs": [
        "https://www.linkedin.com/company/vortex-global-technologies",
        "https://www.instagram.com/vortexglobaltech"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": ["English"]
      }
    }
    </script>

  <!-- JSON-LD: WebSite Schema (enables Google Sitelinks Search Box) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VORTEX Global Technologies",
      "url": "https://www.vortexglobaltechnologies.in/"
    }
    </script>
